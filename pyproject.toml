[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "regtable"
dynamic = ["version"]
description = "Host-side tools for regtable: YAML codegen, a typed Python client verified against the device, and the Web Serial panel"
readme = "python/README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ranger Chen" }]
keywords = ["embedded", "mcu", "modbus", "mqtt", "register", "serial", "codegen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Embedded Systems",
    "Topic :: Software Development :: Code Generators",
]
dependencies = ["pyyaml>=5.1", "pyserial>=3.4"]

[project.urls]
Homepage = "https://regtable.dev"
Source = "https://github.com/rangersui/regtable"

[project.scripts]
regtable = "regtable.cli:main"

[tool.hatch.version]
path = "python/regtable/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["python/regtable"]

[tool.hatch.build.targets.wheel.force-include]
"regtable_panel.html" = "regtable/regtable_panel.html"

[tool.hatch.build.targets.sdist]
include = ["python/regtable", "python/README.md", "regtable_panel.html", "LICENSE", "pyproject.toml"]
