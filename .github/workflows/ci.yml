name: ci

on:
  push:
  pull_request:

jobs:
  # -Werror build + regression test on the three desktop platforms
  strict:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            cc: gcc
          - os: ubuntu-latest
            cc: clang
          - os: macos-latest
            cc: clang
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - run: make strict CC=${{ matrix.cc }}

  # Windows cmd path: build.bat, no make
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - shell: cmd
        run: |
          .\build strict

  # ILP32: long is 32 bits, so the ULONG_MAX guards compile out and
  # the parser must hold on its own (as it will on the MCU)
  x86-32bit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-multilib
      - run: make strict CFLAGS="-std=c99 -Wall -Wextra -Wpedantic -O2 -m32"

  # the library sources under the real target toolchain, compile only
  cortex-m:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-arm-none-eabi
      - run: |
          for cpu in cortex-m0 cortex-m4; do
            arm-none-eabi-gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -Os \
              -mcpu=$cpu -mthumb -ffunction-sections -fdata-sections \
              -Isrc -c src/regtable_core.c src/regtable_cli.c src/regtable_modbus.c src/regtable_mqtt.c
            arm-none-eabi-size regtable_core.o regtable_cli.o regtable_modbus.o regtable_mqtt.o
          done

  # the Arduino example, built the way the IDE builds it: repo as a
  # library (src/ + library.properties), sketch is C++, core is avr-gcc
  arduino:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - run: arduino-cli core update-index && arduino-cli core install arduino:avr
      - run: arduino-cli lib install Ethernet PubSubClient
      - run: arduino-cli compile --fqbn arduino:avr:uno --library . --warnings all examples/arduino
      - run: arduino-cli compile --fqbn arduino:avr:uno --library . --warnings all examples/arduino_modbus
      - run: arduino-cli compile --fqbn arduino:avr:uno --library . --warnings all examples/arduino_modbus_tcp
      - run: arduino-cli compile --fqbn arduino:avr:uno --library . --warnings all examples/arduino_mqtt

  # runtime checks: memory errors and undefined behaviour under the test
  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -O1 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Isrc -o regtest regtable_test.c src/regtable_core.c src/regtable_cli.c -lm
          ./regtest
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -O1 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Isrc -o mbtest regtable_modbus_test.c src/regtable_core.c src/regtable_cli.c src/regtable_modbus.c -lm
          ./mbtest
          gcc -std=c99 -Wall -Wextra -Wpedantic -Werror -O1 -g \
            -fsanitize=address,undefined -fno-sanitize-recover=all \
            -Isrc -o mqtest regtable_mqtt_test.c src/regtable_core.c src/regtable_cli.c src/regtable_modbus.c src/regtable_mqtt.c -lm
          ./mqtest

  # YAML -> C table -> compile -> run, plus the validator rejections
  codegen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install pyyaml
      - run: make codegen

  # coverage-guided search on the CLI byte path
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make fuzz FUZZ_TIME=90
      - run: make fuzz-mb FUZZ_TIME=90
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-crashes
          path: |
            crash-*
            leak-*
            timeout-*
          if-no-files-found: ignore
